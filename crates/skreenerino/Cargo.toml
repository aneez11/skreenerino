[package]
name = "skreenerino"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["xcap", "h264", "quic", "mdns", "viewer"]
xcap = ["skreen-capture/xcap"]
h264 = ["skreen-codec/h264"]
quic = ["skreen-transport/quic", "dep:quinn", "dep:rustls"]
mdns = ["skreen-discovery/mdns"]
viewer = ["skreen-render/wgpu", "dep:pollster"]
gui = ["viewer", "skreen-render/gui", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:wgpu", "dep:winit", "dep:pollster", "dep:raw-window-handle", "dep:tray-icon"]
audio = ["skreen-audio/native"]
soak = []

[dependencies]
anyhow.workspace = true
quinn = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
pollster = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
skreen-proto.workspace = true
skreen-discovery.workspace = true
skreen-capture.workspace = true
skreen-codec.workspace = true
skreen-transport.workspace = true
skreen-session.workspace = true
skreen-security.workspace = true
skreen-render.workspace = true
skreen-app = { workspace = true, default-features = false, features = ["full", "quic"] }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true, features = ["winit"] }
egui-winit = { workspace = true, optional = true, default-features = false, features = ["clipboard", "links"] }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
raw-window-handle = { version = "0.6", optional = true }
tray-icon = { version = "0.26", optional = true }
skreen-audio.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg"] }












