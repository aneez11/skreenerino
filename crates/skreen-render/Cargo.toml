[package]
name = "skreen-render"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
wgpu = ["dep:wgpu", "dep:winit", "dep:pollster"]
gui = ["wgpu", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true, features = ["winit"] }
egui-winit = { workspace = true, optional = true, default-features = false, features = ["clipboard", "links"] }



