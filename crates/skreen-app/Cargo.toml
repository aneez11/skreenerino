[package]
name = "skreen-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
xcap = ["skreen-capture/xcap"]
h264 = ["skreen-codec/h264"]
quic = ["skreen-transport/quic", "dep:quinn", "dep:rustls"]
mdns = ["skreen-discovery/mdns"]
audio = ["skreen-audio/native"]
full = ["xcap", "h264", "quic", "mdns"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = "1"
skreen-proto.workspace = true
skreen-discovery.workspace = true
skreen-capture.workspace = true
skreen-codec.workspace = true
skreen-transport.workspace = true
skreen-session.workspace = true
skreen-security.workspace = true
skreen-render.workspace = true
skreen-audio.workspace = true
quinn = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }


